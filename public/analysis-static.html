<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astikan Analysis</title>
    <style>
      body {
        margin: 0;
        font-family: "Sora", system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: grid;
        min-height: 100vh;

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0;
        font-size: 15px;
        color: #475569;
      }

  <body>
    <div class="card">
      <h1>Analysis is loading</h1>
